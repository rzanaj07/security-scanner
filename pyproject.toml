[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "secscan"
dynamic = ["version"]
description = "Defensive security scanner: open ports, TLS certificates and HTTP security headers, with HTML/JSON reports"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "rzanaj07" }]
keywords = ["security", "scanner", "tls", "http-headers", "port-scanner", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31",
    "jinja2>=3.1",
    "certifi",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
    "httpx",
]

[project.scripts]
secscan = "secscan.cli:main"

[project.urls]
Repository = "https://github.com/rzanaj07/security-scanner"

[tool.hatch.version]
path = "src/secscan/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/secscan"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
